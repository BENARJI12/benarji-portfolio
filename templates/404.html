{% extends "base.html" %}

{% block title %}404 - Page Not Found | {{ profile.name }}{% endblock %}

{% block content %}
<section class="section" style="min-height: 70vh; display: flex; align-items: center; justify-content: center; text-align: center;">
  <div class="container" style="max-width: 600px;">
    <div style="font-size: 5rem; font-weight: 800; line-height: 1;" class="accent-text-gradient">404</div>
    <h1 style="font-size: 2rem; font-weight: 700; color: #ffffff; margin: 1rem 0;">Page Not Found</h1>
    <p style="color: var(--text-secondary); margin-bottom: 2rem; font-size: 1.05rem;">
      The requested route does not exist or has been moved. Use the navigation or return to the home page.
    </p>
    <a href="{{ url_for('index') }}" class="btn btn-primary">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      <span>Return to Portfolio</span>
    </a>
  </div>
</section>
{% endblock %}
